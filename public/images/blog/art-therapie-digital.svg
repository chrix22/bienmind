<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent4a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.2" />
    </linearGradient>
    <radialGradient id="glow4" cx="40%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
    <linearGradient id="brush4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:0.1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg4)" />
  <rect width="1200" height="630" fill="url(#glow4)" />

  <!-- Soft background blobs -->
  <circle cx="200" cy="150" r="200" fill="#ec4899" opacity="0.08" />
  <circle cx="900" cy="500" r="250" fill="#7c3aed" opacity="0.1" />
  <circle cx="600" cy="300" r="280" fill="#ffffff" opacity="0.03" />

  <!-- Abstract canvas / frame -->
  <rect x="380" y="120" width="440" height="340" rx="8" fill="#ffffff" opacity="0.06" stroke="#ffffff" stroke-width="2" opacity="0.3" />
  <rect x="395" y="135" width="410" height="310" rx="4" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.15" />

  <!-- Abstract brush strokes on canvas -->
  <path d="M420 250 Q480 200 560 230 Q640 260 700 220 Q760 180 780 200" fill="none" stroke="url(#brush4)" stroke-width="20" stroke-linecap="round" opacity="0.5" />
  <path d="M430 310 Q510 350 580 300 Q650 250 730 290 Q770 310 780 300" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.12" />
  <path d="M440 370 Q500 340 560 370 Q620 400 700 360" fill="none" stroke="#ec4899" stroke-width="8" stroke-linecap="round" opacity="0.2" />

  <!-- Paint splatters / circles -->
  <circle cx="450" cy="200" r="18" fill="#ec4899" opacity="0.2" />
  <circle cx="550" cy="180" r="12" fill="#7c3aed" opacity="0.25" />
  <circle cx="680" cy="190" r="22" fill="#ffffff" opacity="0.08" />
  <circle cx="620" cy="380" r="15" fill="#ec4899" opacity="0.15" />
  <circle cx="500" cy="400" r="10" fill="#ffffff" opacity="0.1" />

  <!-- Abstract paintbrush -->
  <g transform="translate(850, 200) rotate(35)">
    <!-- Brush handle -->
    <rect x="0" y="-6" width="140" height="12" rx="6" fill="#ffffff" opacity="0.25" />
    <!-- Brush ferrule -->
    <rect x="-15" y="-8" width="20" height="16" rx="3" fill="#ffffff" opacity="0.35" />
    <!-- Brush tip -->
    <path d="M-15 -10 Q-40 -12 -50 0 Q-40 12 -15 10Z" fill="#ec4899" opacity="0.4" />
  </g>

  <!-- Digital elements - pixel grid hint -->
  <g transform="translate(120, 320)" opacity="0.15">
    <rect x="0" y="0" width="16" height="16" fill="#ffffff" />
    <rect x="20" y="0" width="16" height="16" fill="#ffffff" opacity="0.7" />
    <rect x="40" y="0" width="16" height="16" fill="#ffffff" opacity="0.4" />
    <rect x="0" y="20" width="16" height="16" fill="#ffffff" opacity="0.5" />
    <rect x="20" y="20" width="16" height="16" fill="#ffffff" opacity="0.9" />
    <rect x="40" y="20" width="16" height="16" fill="#ffffff" opacity="0.6" />
    <rect x="0" y="40" width="16" height="16" fill="#ffffff" opacity="0.3" />
    <rect x="20" y="40" width="16" height="16" fill="#ffffff" opacity="0.6" />
    <rect x="40" y="40" width="16" height="16" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Color palette circles -->
  <g transform="translate(950, 380)">
    <circle cx="0" cy="0" r="22" fill="#ec4899" opacity="0.35" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="50" cy="10" r="22" fill="#7c3aed" opacity="0.35" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="25" cy="50" r="22" fill="#ffffff" opacity="0.15" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="75" cy="45" r="18" fill="#f59e0b" opacity="0.2" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Floating cursor / pen tool hint -->
  <g transform="translate(300, 200)" opacity="0.3">
    <path d="M0 0 L5 20 L10 15 L20 25" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Decorative dots -->
  <circle cx="180" cy="480" r="4" fill="#ffffff" opacity="0.3" />
  <circle cx="1050" cy="180" r="5" fill="#ffffff" opacity="0.25" />
  <circle cx="320" cy="520" r="3" fill="#ffffff" opacity="0.3" />
  <circle cx="880" cy="120" r="4" fill="#ffffff" opacity="0.2" />
  <circle cx="750" cy="530" r="5" fill="#ffffff" opacity="0.2" />
  <circle cx="500" cy="90" r="3" fill="#ffffff" opacity="0.25" />
  <circle cx="1100" cy="300" r="4" fill="#ffffff" opacity="0.2" />

  <!-- Abstract flowing line -->
  <path d="M0 520 Q200 480 400 510 Q600 540 800 500 Q1000 460 1200 490" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.1" />
  <path d="M0 550 Q200 510 400 540 Q600 570 800 530 Q1000 490 1200 520" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.07" />

  <!-- Stars / sparkle hints -->
  <g transform="translate(280, 140)" opacity="0.35">
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#ffffff" stroke-width="1.5" />
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#ffffff" stroke-width="1.5" />
    <line x1="-4" y1="-4" x2="4" y2="4" stroke="#ffffff" stroke-width="1" />
    <line x1="4" y1="-4" x2="-4" y2="4" stroke="#ffffff" stroke-width="1" />
  </g>
  <g transform="translate(1020, 260)" opacity="0.25">
    <line x1="-5" y1="0" x2="5" y2="0" stroke="#ffffff" stroke-width="1.5" />
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#ffffff" stroke-width="1.5" />
    <line x1="-3" y1="-3" x2="3" y2="3" stroke="#ffffff" stroke-width="1" />
    <line x1="3" y1="-3" x2="-3" y2="3" stroke="#ffffff" stroke-width="1" />
  </g>
</svg>