<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-svc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="block-svc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="glass-svc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <radialGradient id="glow-svc" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-svc)" />
  <ellipse cx="600" cy="280" rx="600" ry="350" fill="url(#glow-svc)" />

  <!-- Perspective grid floor -->
  <g opacity="0.06" stroke="#4f46e5" stroke-width="1">
    <line x1="600" y1="300" x2="0" y2="630" />
    <line x1="600" y1="300" x2="200" y2="630" />
    <line x1="600" y1="300" x2="400" y2="630" />
    <line x1="600" y1="300" x2="600" y2="630" />
    <line x1="600" y1="300" x2="800" y2="630" />
    <line x1="600" y1="300" x2="1000" y2="630" />
    <line x1="600" y1="300" x2="1200" y2="630" />
    <line x1="100" y1="430" x2="1100" y2="430" />
    <line x1="200" y1="500" x2="1000" y2="500" />
    <line x1="300" y1="560" x2="900" y2="560" />
  </g>

  <!-- Vertical stack of building blocks (center-left) -->
  <g transform="translate(300, 80)">
    <!-- Block 5 (top) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="180" height="70" rx="12" fill="url(#block-svc)" opacity="0.35" stroke="#4f46e5" stroke-width="1" stroke-opacity="0.4" />
      <rect x="15" y="15" width="60" height="8" rx="4" fill="#ffffff" opacity="0.3" />
      <rect x="15" y="30" width="100" height="6" rx="3" fill="#ffffff" opacity="0.15" />
      <circle cx="150" cy="35" r="14" fill="#ffffff" opacity="0.1" />
    </g>
    <!-- Block 4 -->
    <g transform="translate(-20, 85)">
      <rect x="0" y="0" width="220" height="70" rx="12" fill="url(#block-svc)" opacity="0.45" stroke="#4f46e5" stroke-width="1" stroke-opacity="0.5" />
      <rect x="15" y="15" width="80" height="8" rx="4" fill="#ffffff" opacity="0.3" />
      <rect x="15" y="30" width="130" height="6" rx="3" fill="#ffffff" opacity="0.15" />
      <rect x="15" y="44" width="90" height="6" rx="3" fill="#ffffff" opacity="0.1" />
      <circle cx="190" cy="35" r="14" fill="#ffffff" opacity="0.1" />
    </g>
    <!-- Block 3 -->
    <g transform="translate(-40, 170)">
      <rect x="0" y="0" width="260" height="70" rx="12" fill="url(#block-svc)" opacity="0.55" stroke="#2563eb" stroke-width="1" stroke-opacity="0.5" />
      <rect x="15" y="15" width="90" height="8" rx="4" fill="#ffffff" opacity="0.35" />
      <rect x="15" y="30" width="150" height="6" rx="3" fill="#ffffff" opacity="0.2" />
      <rect x="15" y="44" width="110" height="6" rx="3" fill="#ffffff" opacity="0.12" />
      <circle cx="225" cy="35" r="16" fill="#ffffff" opacity="0.1" />
    </g>
    <!-- Block 2 -->
    <g transform="translate(-60, 255)">
      <rect x="0" y="0" width="300" height="70" rx="12" fill="url(#block-svc)" opacity="0.65" stroke="#2563eb" stroke-width="1.5" stroke-opacity="0.5" />
      <rect x="15" y="15" width="100" height="8" rx="4" fill="#ffffff" opacity="0.35" />
      <rect x="15" y="30" width="170" height="6" rx="3" fill="#ffffff" opacity="0.2" />
      <rect x="15" y="44" width="130" height="6" rx="3" fill="#ffffff" opacity="0.12" />
      <circle cx="260" cy="35" r="18" fill="#ffffff" opacity="0.1" />
    </g>
    <!-- Block 1 (base - largest) -->
    <g transform="translate(-80, 340)">
      <rect x="0" y="0" width="340" height="80" rx="14" fill="url(#block-svc)" opacity="0.75" stroke="#2563eb" stroke-width="2" stroke-opacity="0.6" />
      <rect x="18" y="18" width="120" height="10" rx="5" fill="#ffffff" opacity="0.4" />
      <rect x="18" y="35" width="200" height="7" rx="3.5" fill="#ffffff" opacity="0.2" />
      <rect x="18" y="50" width="150" height="7" rx="3.5" fill="#ffffff" opacity="0.12" />
      <circle cx="295" cy="40" r="22" fill="#ffffff" opacity="0.1" />
    </g>
  </g>

  <!-- Vertical arrow indicator -->
  <g transform="translate(140, 180)" opacity="0.3">
    <line x1="0" y1="300" x2="0" y2="0" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" />
    <polygon points="0,-15 -10,5 10,5" fill="#4f46e5" />
  </g>

  <!-- Cloud shape (top right) -->
  <g transform="translate(850, 100)" opacity="0.2">
    <circle cx="0" cy="0" r="60" fill="#ffffff" />
    <circle cx="50" cy="-15" r="50" fill="#ffffff" />
    <circle cx="100" cy="0" r="55" fill="#ffffff" />
    <circle cx="40" cy="20" r="45" fill="#ffffff" />
    <circle cx="80" cy="25" r="40" fill="#ffffff" />
    <rect x="-30" y="0" width="160" height="50" rx="10" fill="#ffffff" />
  </g>

  <!-- Connection lines from stack to cloud -->
  <g opacity="0.15" stroke="#2563eb" stroke-width="1.5" fill="none" stroke-dasharray="6,4">
    <path d="M500,180 Q650,120 800,110" />
    <path d="M480,250 Q650,180 820,130" />
    <path d="M460,330 Q650,250 840,150" />
  </g>

  <!-- API/Integration dots -->
  <g fill="#2563eb" opacity="0.4">
    <circle cx="650" cy="150" r="5" />
    <circle cx="700" cy="200" r="4" />
    <circle cx="740" cy="155" r="6" />
    <circle cx="660" cy="230" r="4" />
  </g>

  <!-- Right side - module cards floating -->
  <g transform="translate(750, 250)">
    <rect x="0" y="0" width="170" height="90" rx="10" fill="url(#glass-svc)" stroke="#4f46e5" stroke-width="1" stroke-opacity="0.3" />
    <rect x="12" y="12" width="60" height="7" rx="3.5" fill="#2563eb" opacity="0.4" />
    <rect x="12" y="26" width="100" height="5" rx="2.5" fill="#ffffff" opacity="0.15" />
    <rect x="12" y="38" width="80" height="5" rx="2.5" fill="#ffffff" opacity="0.1" />
    <rect x="12" y="58" width="146" height="20" rx="6" fill="#2563eb" opacity="0.2" />
  </g>
  <g transform="translate(780, 370)">
    <rect x="0" y="0" width="170" height="90" rx="10" fill="url(#glass-svc)" stroke="#4f46e5" stroke-width="1" stroke-opacity="0.3" />
    <rect x="12" y="12" width="70" height="7" rx="3.5" fill="#4f46e5" opacity="0.4" />
    <rect x="12" y="26" width="110" height="5" rx="2.5" fill="#ffffff" opacity="0.15" />
    <rect x="12" y="38" width="90" height="5" rx="2.5" fill="#ffffff" opacity="0.1" />
    <rect x="12" y="58" width="146" height="20" rx="6" fill="#4f46e5" opacity="0.2" />
  </g>
  <g transform="translate(810, 490)">
    <rect x="0" y="0" width="170" height="80" rx="10" fill="url(#glass-svc)" stroke="#2563eb" stroke-width="1" stroke-opacity="0.25" />
    <rect x="12" y="12" width="55" height="7" rx="3.5" fill="#2563eb" opacity="0.35" />
    <rect x="12" y="26" width="95" height="5" rx="2.5" fill="#ffffff" opacity="0.12" />
    <rect x="12" y="48" width="146" height="18" rx="6" fill="#2563eb" opacity="0.15" />
  </g>

  <!-- Decorative elements -->
  <circle cx="1100" cy="550" r="40" fill="#4f46e5" opacity="0.08" />
  <circle cx="1050" cy="200" r="25" fill="#2563eb" opacity="0.1" />
  <circle cx="100" cy="550" r="50" fill="#2563eb" opacity="0.06" />
</svg>