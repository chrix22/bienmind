<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-nd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#422006" />
    </linearGradient>
    <linearGradient id="leaf-nd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="brown-nd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <radialGradient id="glow-nd" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="tech-nd" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0" />
      <stop offset="50%" stop-color="#059669" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-nd)" />

  <!-- Soft ambient glow -->
  <ellipse cx="400" cy="350" rx="400" ry="350" fill="url(#glow-nd)" />
  <circle cx="900" cy="200" r="250" fill="#92400e" opacity="0.08" />

  <!-- Ground/earth area -->
  <ellipse cx="600" cy="620" rx="700" ry="120" fill="#92400e" opacity="0.12" />

  <!-- Large abstract plant/tree (left-center) -->
  <g transform="translate(350, 300)">
    <!-- Stem -->
    <path d="M0,200 Q-10,100 5,0 Q10,-50 0,-100" stroke="#059669" stroke-width="6" fill="none" opacity="0.6" stroke-linecap="round" />
    <path d="M0,200 Q20,150 40,80" stroke="#059669" stroke-width="4" fill="none" opacity="0.5" stroke-linecap="round" />
    <path d="M0,200 Q-30,160 -50,100" stroke="#059669" stroke-width="3.5" fill="none" opacity="0.45" stroke-linecap="round" />

    <!-- Leaves -->
    <ellipse cx="-10" cy="-120" rx="50" ry="25" fill="url(#leaf-nd)" opacity="0.5" transform="rotate(-30, -10, -120)" />
    <ellipse cx="30" cy="-80" rx="45" ry="22" fill="url(#leaf-nd)" opacity="0.45" transform="rotate(20, 30, -80)" />
    <ellipse cx="-40" cy="-60" rx="40" ry="20" fill="url(#leaf-nd)" opacity="0.4" transform="rotate(-45, -40, -60)" />
    <ellipse cx="50" cy="-30" rx="42" ry="20" fill="#10b981" opacity="0.35" transform="rotate(35, 50, -30)" />
    <ellipse cx="-55" cy="10" rx="38" ry="18" fill="url(#leaf-nd)" opacity="0.3" transform="rotate(-25, -55, 10)" />
    <ellipse cx="45" cy="50" rx="35" ry="17" fill="#10b981" opacity="0.35" transform="rotate(15, 45, 50)" />

    <!-- Small berries/herbs -->
    <circle cx="-20" cy="-140" r="6" fill="#059669" opacity="0.6" />
    <circle cx="-5" cy="-145" r="4" fill="#10b981" opacity="0.5" />
    <circle cx="10" cy="-135" r="5" fill="#059669" opacity="0.55" />
  </g>

  <!-- Smaller herbs (left) -->
  <g transform="translate(120, 420)">
    <path d="M0,80 Q5,40 -10,0" stroke="#059669" stroke-width="3" fill="none" opacity="0.4" stroke-linecap="round" />
    <ellipse cx="-15" cy="-10" rx="25" ry="12" fill="#059669" opacity="0.3" transform="rotate(-20, -15, -10)" />
    <ellipse cx="5" cy="5" rx="22" ry="10" fill="#10b981" opacity="0.25" transform="rotate(30, 5, 5)" />
  </g>

  <!-- Herb sprigs (right area) -->
  <g transform="translate(200, 380)">
    <path d="M0,100 Q-5,50 10,-10" stroke="#10b981" stroke-width="2.5" fill="none" opacity="0.35" stroke-linecap="round" />
    <circle cx="10" cy="-10" r="8" fill="#059669" opacity="0.3" />
    <circle cx="0" cy="20" r="5" fill="#10b981" opacity="0.25" />
    <circle cx="15" cy="15" r="4" fill="#059669" opacity="0.2" />
  </g>

  <!-- Digital overlay / tech mesh (right side) -->
  <g opacity="0.15" stroke="#059669" stroke-width="1">
    <!-- Circuit-like paths -->
    <path d="M700,100 L800,100 L800,200 L900,200" fill="none" />
    <path d="M750,150 L850,150 L850,250 L950,250" fill="none" />
    <path d="M700,200 L750,200 L750,300 L850,300 L850,350" fill="none" />
    <path d="M800,300 L900,300 L900,400 L1000,400" fill="none" />
    <path d="M750,350 L850,350 L850,450 L950,450" fill="none" />
    <path d="M900,150 L1000,150 L1000,250 L1100,250" fill="none" />
    <path d="M950,350 L1050,350 L1050,450 L1150,450" fill="none" />
  </g>

  <!-- Tech nodes / data points -->
  <g fill="#059669">
    <circle cx="700" cy="100" r="5" opacity="0.3" />
    <circle cx="800" cy="200" r="6" opacity="0.35" />
    <circle cx="900" cy="200" r="4" opacity="0.25" />
    <circle cx="750" cy="300" r="5" opacity="0.3" />
    <circle cx="850" cy="300" r="7" opacity="0.35" />
    <circle cx="900" cy="300" r="4" opacity="0.25" />
    <circle cx="1000" cy="400" r="5" opacity="0.3" />
    <circle cx="950" cy="250" r="6" opacity="0.3" />
    <circle cx="1000" cy="150" r="5" opacity="0.28" />
    <circle cx="1100" cy="250" r="6" opacity="0.32" />
    <circle cx="850" cy="350" r="4" opacity="0.25" />
    <circle cx="850" cy="450" r="5" opacity="0.3" />
    <circle cx="1050" cy="350" r="5" opacity="0.28" />
    <circle cx="1150" cy="450" r="6" opacity="0.3" />
  </g>

  <!-- Digital rings overlay on nature (intersection zone) -->
  <g transform="translate(600, 315)">
    <circle r="120" fill="none" stroke="#059669" stroke-width="1" opacity="0.1" />
    <circle r="160" fill="none" stroke="#059669" stroke-width="0.8" opacity="0.08" stroke-dasharray="8,8" />
    <circle r="200" fill="none" stroke="#059669" stroke-width="0.6" opacity="0.06" stroke-dasharray="4,12" />
  </g>

  <!-- Abstract DNA/molecule chain (bridging nature and digital) -->
  <g transform="translate(550, 120)" opacity="0.3">
    <path d="M0,0 Q30,30 0,60 Q-30,90 0,120 Q30,150 0,180 Q-30,210 0,240 Q30,270 0,300 Q-30,330 0,360"
          stroke="#10b981" stroke-width="2" fill="none" />
    <path d="M40,0 Q10,30 40,60 Q70,90 40,120 Q10,150 40,180 Q70,210 40,240 Q10,270 40,300 Q70,330 40,360"
          stroke="#059669" stroke-width="2" fill="none" />
    <!-- Cross connections -->
    <line x1="10" y1="30" x2="30" y2="30" stroke="#059669" stroke-width="1.5" />
    <line x1="10" y1="90" x2="30" y2="90" stroke="#059669" stroke-width="1.5" />
    <line x1="10" y1="150" x2="30" y2="150" stroke="#059669" stroke-width="1.5" />
    <line x1="10" y1="210" x2="30" y2="210" stroke="#059669" stroke-width="1.5" />
    <line x1="10" y1="270" x2="30" y2="270" stroke="#059669" stroke-width="1.5" />
    <line x1="10" y1="330" x2="30" y2="330" stroke="#059669" stroke-width="1.5" />
  </g>

  <!-- Floating particles -->
  <circle cx="680" cy="140" r="3" fill="#10b981" opacity="0.4" />
  <circle cx="780" cy="480" r="4" fill="#059669" opacity="0.3" />
  <circle cx="1050" cy="120" r="3.5" fill="#10b981" opacity="0.25" />
  <circle cx="920" cy="530" r="3" fill="#059669" opacity="0.3" />
  <circle cx="150" cy="150" r="4" fill="#10b981" opacity="0.2" />
  <circle cx="100" cy="300" r="3" fill="#059669" opacity="0.25" />

  <!-- Mortar and pestle hint (bottom left) -->
  <g transform="translate(180, 530)" opacity="0.2">
    <path d="M-40,0 Q-40,-30 0,-35 Q40,-30 40,0 Z" fill="#92400e" />
    <ellipse cx="0" cy="0" rx="45" ry="12" fill="#92400e" />
    <line x1="30" y1="-30" x2="55" y2="-60" stroke="#92400e" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Scan line for digital effect -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#tech-nd)" opacity="0.1">
    <animate attributeName="y" from="0" to="630" dur="8s" repeatCount="indefinite" />
  </rect>
</svg>