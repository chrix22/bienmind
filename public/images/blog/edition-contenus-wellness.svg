<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card2a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="card2b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:0.2" />
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg2)" />

  <!-- Soft background shapes -->
  <circle cx="900" cy="100" r="250" fill="#7c3aed" opacity="0.1" />
  <circle cx="200" cy="530" r="200" fill="#2563eb" opacity="0.1" />
  <ellipse cx="600" cy="315" rx="500" ry="280" fill="url(#glow2)" />

  <!-- Floating card 1 - back -->
  <g transform="rotate(-8, 380, 280)">
    <rect x="280" y="170" width="200" height="260" rx="12" fill="url(#card2a)" stroke="#ffffff" stroke-width="1" opacity="0.4" />
    <rect x="305" y="200" width="100" height="8" rx="4" fill="#ffffff" opacity="0.3" />
    <rect x="305" y="220" width="150" height="6" rx="3" fill="#ffffff" opacity="0.15" />
    <rect x="305" y="235" width="130" height="6" rx="3" fill="#ffffff" opacity="0.15" />
    <rect x="305" y="250" width="140" height="6" rx="3" fill="#ffffff" opacity="0.15" />
    <rect x="305" y="280" width="150" height="80" rx="8" fill="#ffffff" opacity="0.08" />
  </g>

  <!-- Floating card 2 - main center -->
  <g transform="rotate(3, 560, 300)">
    <rect x="440" y="150" width="240" height="310" rx="14" fill="url(#card2a)" stroke="#ffffff" stroke-width="1.5" opacity="0.6" />
    <rect x="470" y="185" width="80" height="10" rx="5" fill="#ffffff" opacity="0.5" />
    <rect x="470" y="210" width="180" height="7" rx="3.5" fill="#ffffff" opacity="0.2" />
    <rect x="470" y="228" width="160" height="7" rx="3.5" fill="#ffffff" opacity="0.2" />
    <rect x="470" y="246" width="170" height="7" rx="3.5" fill="#ffffff" opacity="0.2" />
    <rect x="470" y="275" width="180" height="100" rx="10" fill="#7c3aed" opacity="0.15" />
    <!-- Image placeholder icon inside card -->
    <circle cx="560" cy="325" r="20" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3" />
    <path d="M550 335 L555 328 L562 332 L570 320 L575 335Z" fill="#ffffff" opacity="0.2" />
    <rect x="470" y="395" width="140" height="7" rx="3.5" fill="#ffffff" opacity="0.2" />
    <rect x="470" y="412" width="120" height="7" rx="3.5" fill="#ffffff" opacity="0.2" />
  </g>

  <!-- Floating card 3 - right -->
  <g transform="rotate(12, 800, 290)">
    <rect x="710" y="190" width="190" height="240" rx="12" fill="url(#card2a)" stroke="#ffffff" stroke-width="1" opacity="0.35" />
    <rect x="735" y="220" width="90" height="8" rx="4" fill="#ffffff" opacity="0.3" />
    <rect x="735" y="240" width="140" height="6" rx="3" fill="#ffffff" opacity="0.15" />
    <rect x="735" y="255" width="120" height="6" rx="3" fill="#ffffff" opacity="0.15" />
    <rect x="735" y="285" width="140" height="70" rx="8" fill="#ffffff" opacity="0.08" />
    <rect x="735" y="375" width="100" height="6" rx="3" fill="#ffffff" opacity="0.15" />
  </g>

  <!-- Small floating card - top right -->
  <g transform="rotate(-5, 950, 180)">
    <rect x="890" y="110" width="120" height="150" rx="10" fill="url(#card2a)" stroke="#ffffff" stroke-width="1" opacity="0.25" />
    <rect x="910" y="135" width="60" height="6" rx="3" fill="#ffffff" opacity="0.2" />
    <rect x="910" y="150" width="80" height="5" rx="2.5" fill="#ffffff" opacity="0.1" />
    <rect x="910" y="162" width="70" height="5" rx="2.5" fill="#ffffff" opacity="0.1" />
  </g>

  <!-- Small floating card - bottom left -->
  <g transform="rotate(6, 200, 420)">
    <rect x="130" y="360" width="140" height="130" rx="10" fill="url(#card2a)" stroke="#ffffff" stroke-width="1" opacity="0.25" />
    <rect x="155" y="385" width="70" height="6" rx="3" fill="#ffffff" opacity="0.2" />
    <rect x="155" y="400" width="90" height="5" rx="2.5" fill="#ffffff" opacity="0.1" />
    <rect x="155" y="412" width="80" height="5" rx="2.5" fill="#ffffff" opacity="0.1" />
  </g>

  <!-- Publish / send icon - abstract arrow -->
  <g transform="translate(980, 440)" opacity="0.3">
    <circle r="35" fill="#ffffff" opacity="0.1" />
    <path d="M-12 8 L12 0 L-12 -8 L-6 0Z" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- Decorative dots -->
  <circle cx="150" cy="180" r="4" fill="#ffffff" opacity="0.3" />
  <circle cx="350" cy="520" r="5" fill="#ffffff" opacity="0.25" />
  <circle cx="700" cy="100" r="3" fill="#ffffff" opacity="0.35" />
  <circle cx="1050" cy="350" r="4" fill="#ffffff" opacity="0.3" />
  <circle cx="500" cy="530" r="6" fill="#ffffff" opacity="0.2" />
  <circle cx="850" cy="520" r="3" fill="#ffffff" opacity="0.25" />

  <!-- Connection lines between cards -->
  <line x1="480" y1="310" x2="440" y2="300" stroke="#ffffff" stroke-width="1" opacity="0.1" stroke-dasharray="4,4" />
  <line x1="680" y1="310" x2="720" y2="310" stroke="#ffffff" stroke-width="1" opacity="0.1" stroke-dasharray="4,4" />

  <!-- Floating plus icons -->
  <g transform="translate(340, 130)" opacity="0.25">
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#ffffff" stroke-width="2" />
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#ffffff" stroke-width="2" />
  </g>
  <g transform="translate(900, 500)" opacity="0.2">
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#ffffff" stroke-width="2" />
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#ffffff" stroke-width="2" />
  </g>
</svg>