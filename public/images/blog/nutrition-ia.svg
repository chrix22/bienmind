<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent3a" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
    <radialGradient id="glow3" cx="30%" cy="60%" r="50%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glow3b" cx="70%" cy="40%" r="40%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg3)" />
  <rect width="1200" height="630" fill="url(#glow3)" />
  <rect width="1200" height="630" fill="url(#glow3b)" />

  <!-- Soft background shapes -->
  <circle cx="300" cy="500" r="200" fill="#10b981" opacity="0.1" />
  <circle cx="900" cy="150" r="180" fill="#f59e0b" opacity="0.1" />

  <!-- Abstract bowl -->
  <path d="M350 340 Q360 430 500 450 Q640 430 650 340" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6" stroke-linecap="round" />
  <ellipse cx="500" cy="340" rx="150" ry="30" fill="#ffffff" opacity="0.08" />
  <path d="M380 340 Q500 360 620 340" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2" />

  <!-- Abstract fruit - apple shape -->
  <circle cx="460" cy="290" r="30" fill="#ffffff" opacity="0.15" />
  <circle cx="490" cy="285" r="28" fill="#ffffff" opacity="0.12" />
  <path d="M475 260 Q478 240 485 245" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4" stroke-linecap="round" />

  <!-- Abstract fruit - citrus -->
  <circle cx="540" cy="295" r="25" fill="#f59e0b" opacity="0.2" />
  <circle cx="540" cy="295" r="15" fill="#ffffff" opacity="0.08" />
  <!-- Citrus segments -->
  <line x1="540" y1="280" x2="540" y2="310" stroke="#ffffff" stroke-width="1" opacity="0.15" />
  <line x1="525" y1="295" x2="555" y2="295" stroke="#ffffff" stroke-width="1" opacity="0.15" />

  <!-- Abstract leaf near bowl -->
  <path d="M580 275 Q600 255 620 275 Q600 295 580 275Z" fill="#10b981" opacity="0.25" />
  <line x1="580" y1="275" x2="620" y2="275" stroke="#ffffff" stroke-width="1" opacity="0.2" />

  <!-- Data chart overlay - right side -->
  <g transform="translate(780, 180)">
    <!-- Chart background -->
    <rect x="0" y="0" width="280" height="200" rx="12" fill="url(#accent3a)" stroke="#ffffff" stroke-width="1" opacity="0.5" />

    <!-- Grid lines -->
    <line x1="40" y1="30" x2="40" y2="170" stroke="#ffffff" stroke-width="0.5" opacity="0.15" />
    <line x1="40" y1="170" x2="250" y2="170" stroke="#ffffff" stroke-width="0.5" opacity="0.15" />
    <line x1="40" y1="130" x2="250" y2="130" stroke="#ffffff" stroke-width="0.5" opacity="0.08" stroke-dasharray="3,3" />
    <line x1="40" y1="90" x2="250" y2="90" stroke="#ffffff" stroke-width="0.5" opacity="0.08" stroke-dasharray="3,3" />
    <line x1="40" y1="50" x2="250" y2="50" stroke="#ffffff" stroke-width="0.5" opacity="0.08" stroke-dasharray="3,3" />

    <!-- Bar chart -->
    <rect x="60" y="100" width="25" height="70" rx="4" fill="#ffffff" opacity="0.3" />
    <rect x="100" y="70" width="25" height="100" rx="4" fill="#ffffff" opacity="0.4" />
    <rect x="140" y="50" width="25" height="120" rx="4" fill="#ffffff" opacity="0.5" />
    <rect x="180" y="80" width="25" height="90" rx="4" fill="#ffffff" opacity="0.35" />
    <rect x="220" y="60" width="25" height="110" rx="4" fill="#ffffff" opacity="0.45" />

    <!-- Trend line -->
    <path d="M72 95 L112 65 L152 45 L192 75 L232 55" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Dots on trend line -->
    <circle cx="72" cy="95" r="3" fill="#ffffff" opacity="0.8" />
    <circle cx="112" cy="65" r="3" fill="#ffffff" opacity="0.8" />
    <circle cx="152" cy="45" r="3" fill="#ffffff" opacity="0.8" />
    <circle cx="192" cy="75" r="3" fill="#ffffff" opacity="0.8" />
    <circle cx="232" cy="55" r="3" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Small data card - bottom right -->
  <g transform="translate(830, 420)">
    <rect x="0" y="0" width="180" height="100" rx="10" fill="url(#accent3a)" stroke="#ffffff" stroke-width="1" opacity="0.35" />
    <circle cx="35" cy="35" r="15" fill="#10b981" opacity="0.25" />
    <rect x="65" y="25" width="80" height="6" rx="3" fill="#ffffff" opacity="0.2" />
    <rect x="65" y="40" width="60" height="5" rx="2.5" fill="#ffffff" opacity="0.12" />
    <rect x="20" y="65" width="140" height="20" rx="10" fill="#f59e0b" opacity="0.15" />
  </g>

  <!-- Abstract molecule / nutrient symbols -->
  <circle cx="200" cy="200" r="20" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.2" />
  <circle cx="240" cy="170" r="12" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2" />
  <line x1="215" y1="188" x2="232" y2="178" stroke="#ffffff" stroke-width="1.5" opacity="0.15" />
  <circle cx="170" cy="230" r="10" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2" />
  <line x1="185" y1="215" x2="176" y2="223" stroke="#ffffff" stroke-width="1.5" opacity="0.15" />

  <!-- Floating dots -->
  <circle cx="420" cy="180" r="4" fill="#ffffff" opacity="0.3" />
  <circle cx="680" cy="400" r="5" fill="#ffffff" opacity="0.25" />
  <circle cx="150" cy="420" r="3" fill="#ffffff" opacity="0.3" />
  <circle cx="700" cy="150" r="4" fill="#ffffff" opacity="0.2" />
  <circle cx="350" cy="530" r="4" fill="#ffffff" opacity="0.2" />
  <circle cx="1100" cy="550" r="5" fill="#ffffff" opacity="0.15" />

  <!-- DNA / data helix hint -->
  <g opacity="0.15">
    <path d="M100 350 Q120 370 100 390 Q80 410 100 430 Q120 450 100 470" fill="none" stroke="#ffffff" stroke-width="2" />
    <path d="M130 350 Q110 370 130 390 Q150 410 130 430 Q110 450 130 470" fill="none" stroke="#ffffff" stroke-width="2" />
    <line x1="100" y1="370" x2="130" y2="370" stroke="#ffffff" stroke-width="1" />
    <line x1="100" y1="410" x2="130" y2="410" stroke="#ffffff" stroke-width="1" />
    <line x1="100" y1="450" x2="130" y2="450" stroke="#ffffff" stroke-width="1" />
  </g>
</svg>