<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-eds" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e3a5f" />
    </linearGradient>
    <linearGradient id="shield-eds" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6b7280" />
    </linearGradient>
    <linearGradient id="glow-eds" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="radial-eds" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-eds)" />

  <!-- Ambient glow -->
  <ellipse cx="600" cy="315" rx="500" ry="300" fill="url(#radial-eds)" />

  <!-- Grid pattern for digital feel -->
  <g opacity="0.06" stroke="#3b82f6" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="630" /><line x1="60" y1="0" x2="60" y2="630" />
    <line x1="120" y1="0" x2="120" y2="630" /><line x1="180" y1="0" x2="180" y2="630" />
    <line x1="240" y1="0" x2="240" y2="630" /><line x1="300" y1="0" x2="300" y2="630" />
    <line x1="360" y1="0" x2="360" y2="630" /><line x1="420" y1="0" x2="420" y2="630" />
    <line x1="480" y1="0" x2="480" y2="630" /><line x1="540" y1="0" x2="540" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" /><line x1="660" y1="0" x2="660" y2="630" />
    <line x1="720" y1="0" x2="720" y2="630" /><line x1="780" y1="0" x2="780" y2="630" />
    <line x1="840" y1="0" x2="840" y2="630" /><line x1="900" y1="0" x2="900" y2="630" />
    <line x1="960" y1="0" x2="960" y2="630" /><line x1="1020" y1="0" x2="1020" y2="630" />
    <line x1="1080" y1="0" x2="1080" y2="630" /><line x1="1140" y1="0" x2="1140" y2="630" />
    <line x1="0" y1="63" x2="1200" y2="63" /><line x1="0" y1="126" x2="1200" y2="126" />
    <line x1="0" y1="189" x2="1200" y2="189" /><line x1="0" y1="252" x2="1200" y2="252" />
    <line x1="0" y1="315" x2="1200" y2="315" /><line x1="0" y1="378" x2="1200" y2="378" />
    <line x1="0" y1="441" x2="1200" y2="441" /><line x1="0" y1="504" x2="1200" y2="504" />
    <line x1="0" y1="567" x2="1200" y2="567" />
  </g>

  <!-- Data flow lines (left side - unprotected data) -->
  <g opacity="0.3">
    <path d="M50,150 Q200,200 350,180" stroke="#6b7280" stroke-width="2" fill="none" stroke-dasharray="8,4" />
    <path d="M80,250 Q220,280 350,240" stroke="#6b7280" stroke-width="1.5" fill="none" stroke-dasharray="6,4" />
    <path d="M30,350 Q180,320 350,330" stroke="#6b7280" stroke-width="2" fill="none" stroke-dasharray="8,4" />
    <path d="M100,430 Q230,400 350,420" stroke="#6b7280" stroke-width="1.5" fill="none" stroke-dasharray="6,4" />
    <path d="M60,500 Q200,470 350,490" stroke="#6b7280" stroke-width="1.5" fill="none" stroke-dasharray="8,4" />
  </g>

  <!-- Data dots flowing -->
  <circle cx="120" cy="165" r="4" fill="#6b7280" opacity="0.5" />
  <circle cx="220" cy="205" r="3" fill="#6b7280" opacity="0.4" />
  <circle cx="160" cy="260" r="3.5" fill="#6b7280" opacity="0.45" />
  <circle cx="100" cy="340" r="4" fill="#6b7280" opacity="0.5" />
  <circle cx="200" cy="315" r="3" fill="#6b7280" opacity="0.4" />
  <circle cx="170" cy="420" r="3.5" fill="#6b7280" opacity="0.45" />
  <circle cx="130" cy="490" r="3" fill="#6b7280" opacity="0.4" />

  <!-- Central shield -->
  <g transform="translate(600, 315)">
    <!-- Shield glow -->
    <ellipse cx="0" cy="0" rx="180" ry="200" fill="#3b82f6" opacity="0.06" />

    <!-- Shield shape -->
    <path d="M0,-150 L120,-100 L120,30 Q120,130 0,170 Q-120,130 -120,30 L-120,-100 Z"
          fill="url(#shield-eds)" opacity="0.25" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.6" />
    <path d="M0,-120 L95,-78 L95,25 Q95,105 0,138 Q-95,105 -95,25 L-95,-78 Z"
          fill="none" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.3" />

    <!-- Lock icon inside shield -->
    <rect x="-30" y="-20" width="60" height="50" rx="8" fill="#3b82f6" opacity="0.5" />
    <path d="M-18,-20 L-18,-42 Q-18,-65 0,-65 Q18,-65 18,-42 L18,-20"
          fill="none" stroke="#3b82f6" stroke-width="4" stroke-opacity="0.7" stroke-linecap="round" />
    <circle cx="0" cy="8" r="8" fill="#ffffff" opacity="0.7" />
    <rect x="-2" y="8" width="4" height="14" rx="2" fill="#ffffff" opacity="0.7" />
  </g>

  <!-- Protected data flow (right side - secured) -->
  <g opacity="0.5">
    <path d="M750,180 Q900,200 1100,160" stroke="#3b82f6" stroke-width="2" fill="none" />
    <path d="M750,260 Q920,280 1120,250" stroke="#3b82f6" stroke-width="1.5" fill="none" />
    <path d="M750,340 Q880,330 1080,350" stroke="#3b82f6" stroke-width="2" fill="none" />
    <path d="M750,420 Q900,400 1100,430" stroke="#3b82f6" stroke-width="1.5" fill="none" />
    <path d="M750,490 Q880,470 1060,500" stroke="#3b82f6" stroke-width="1.5" fill="none" />
  </g>

  <!-- Secured data dots (blue, glowing) -->
  <circle cx="850" cy="195" r="5" fill="#3b82f6" opacity="0.6" />
  <circle cx="1000" cy="170" r="4" fill="#3b82f6" opacity="0.5" />
  <circle cx="900" cy="275" r="4.5" fill="#3b82f6" opacity="0.55" />
  <circle cx="1050" cy="255" r="3.5" fill="#3b82f6" opacity="0.5" />
  <circle cx="880" cy="335" r="5" fill="#3b82f6" opacity="0.6" />
  <circle cx="1000" cy="350" r="4" fill="#3b82f6" opacity="0.5" />
  <circle cx="950" cy="410" r="4" fill="#3b82f6" opacity="0.5" />
  <circle cx="1020" cy="495" r="4.5" fill="#3b82f6" opacity="0.55" />

  <!-- Checkmark badges on right -->
  <g transform="translate(1050, 110)">
    <circle r="16" fill="#3b82f6" opacity="0.3" />
    <path d="M-7,0 L-2,5 L7,-5" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7" />
  </g>
  <g transform="translate(1130, 310)">
    <circle r="14" fill="#3b82f6" opacity="0.25" />
    <path d="M-6,0 L-2,4 L6,-4" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
  </g>
  <g transform="translate(1080, 530)">
    <circle r="15" fill="#3b82f6" opacity="0.28" />
    <path d="M-6,0 L-2,4 L6,-4" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.65" />
  </g>

  <!-- Protection barrier line -->
  <line x1="480" y1="80" x2="480" y2="550" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="12,6" />
  <line x1="720" y1="80" x2="720" y2="550" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="12,6" />
</svg>